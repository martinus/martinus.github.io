<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Word Galaxy</title>
<meta name="description" content="A word puzzle galaxy. Split each field into words, open the fields next to it, and work your way to the core.">
<meta property="og:title" content="Word Galaxy">
<meta property="og:description" content="A word puzzle galaxy. Split each field into words and work your way to the core.">
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #070a14; --panel: #0b1020; --line: #1d2642; --text: #eef0f7; --soft: #c9d1ea; --muted: #a3abc6; --gold: #f2c063; --btn: #34405c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Archivo', system-ui, sans-serif; }
html { overscroll-behavior: none; }
body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.app { height: 100dvh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden; }
header { flex: none; min-height: 56px; padding: env(safe-area-inset-top) 10px 0 4px; display: flex; align-items: center; gap: 8px; background: var(--panel); border-bottom: 1px solid var(--line); }
.level { flex: none; font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
.mid { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
.name { flex: 0 1 auto; min-width: 0; font-size: 21px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.name.long { font-size: 17px; }
.mid { min-width: 0; }
.progress { font-size: 17px; font-weight: 800; color: var(--soft); flex: none; }
.zoom { position: relative; flex: none; height: 70px; background: var(--panel); border-bottom: 1px solid var(--line); }
.zoom canvas { position: absolute; left: 0; top: 0; width: 100%; height: 70px; }
.zoom button { position: absolute; padding: 0; border: none; border-radius: 8px; background: transparent; }
.stage { position: relative; flex: 1; min-height: 0; background: #060913; overflow: hidden; }
#cv { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
#lo { position: absolute; display: block; pointer-events: none; transform-origin: 50% 50%; will-change: transform; }
.bar { flex: none; padding: 8px 14px max(10px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 7px; background: var(--panel); border-top: 1px solid var(--line); }
.msg { height: 50px; overflow: hidden; font-size: 13px; font-weight: 500; line-height: 1.3; color: var(--soft); }
.msg b { font-weight: 800; color: var(--text); }
.row { display: flex; gap: 8px; height: 44px; align-items: center; }
button { font-family: inherit; cursor: pointer; }
.btn { flex: 1; height: 44px; border-radius: 10px; border: 1px solid var(--btn); background: transparent; color: var(--text); font-size: 15px; font-weight: 700; }
.btn.main { border: none; background: var(--gold); color: #1d2433; font-weight: 800; }
.btn.light { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border-color: var(--gold); color: var(--gold); font-size: 18px; font-weight: 800; }
.btn.icon { display: flex; align-items: center; justify-content: center; }
.quick { position: absolute; left: 0; top: 0; width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid #fff; background: #2f8a3a; box-shadow: 0 4px 14px rgba(0,0,0,.55); touch-action: manipulation; }
.btn.danger { border: none; background: #e07a5a; color: #1d2433; font-weight: 800; }
.btn.auto { flex: none; padding: 0 12px; }
.seed { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; font-size: 14px; font-weight: 700; color: var(--soft); }
.seed input { flex: 1; min-width: 0; height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--btn); background: #111a33; color: var(--text); font: 700 16px 'Archivo', system-ui, sans-serif; -webkit-user-select: text; user-select: text; }
.hidden { display: none !important; }
.stars { flex: none; height: 34px; padding: 0 10px 0 7px; display: flex; align-items: center; gap: 5px; border-radius: 17px; border: 1px solid var(--gold); background: transparent; color: var(--gold); font-size: 16px; font-weight: 800; }
#ov { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
.lvl { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; width: 100%; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--btn); background: transparent; color: var(--text); text-align: left; }
.lvl[aria-pressed="true"] { border-color: var(--gold); background: #2a3a6e; }
.lvl .t { font-size: 16px; font-weight: 800; } .lvl .p { color: var(--gold); letter-spacing: .1em; } .lvl .d { font-size: 13px; font-weight: 500; color: var(--soft); }
.ng { display: flex; flex-direction: column; gap: 10px; }
.ng .sub { font-size: 13px; font-weight: 700; color: var(--muted); }
.menu-btn { flex: none; width: 44px; height: 44px; border: none; border-radius: 10px; background: transparent; color: var(--soft); display: flex; align-items: center; justify-content: center; }
.menu { position: absolute; left: 10px; top: 8px; width: 230px; padding: 8px; display: flex; flex-direction: column; gap: 4px; border-radius: 14px; background: #111a33; border: 1px solid #2e3a62; box-shadow: 0 16px 40px rgba(0,0,0,.5); z-index: 5; }
.menu .label { padding: 8px 10px 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.menu a { display: flex; align-items: center; height: 44px; padding: 0 10px; border-radius: 10px; color: var(--text); font-size: 15px; font-weight: 700; text-decoration: none; }
.menu a:hover { background: #1a2547; }
.menu button { height: 44px; padding: 0 10px; border: none; border-radius: 10px; background: transparent; color: var(--text); font-size: 15px; font-weight: 700; text-align: left; }
.menu button:hover { background: #1a2547; }
.menu button.quiet { color: var(--muted); font-weight: 600; }
.dialog-back { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(4,6,13,.72); z-index: 6; }
.dialog { width: 100%; max-width: 330px; padding: 20px; display: flex; flex-direction: column; gap: 12px; border-radius: 16px; background: #111a33; border: 1px solid #2e3a62; }
.dialog h2 { margin: 0; font-size: 20px; font-weight: 800; }
.dialog p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--soft); }
.dialog .row { margin-top: 4px; }
.btn.x { flex: none; width: 40px; font-size: 18px; }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--muted); }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <button type="button" class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
    <div class="name" id="name">Word Galaxy</div>
    <div class="mid">
      <div class="level" id="level"></div>
      <div class="progress" id="progress"></div>
    </div>
    <button type="button" class="stars" id="lightBtn" aria-label="Use one star for a hint" title="Use a star for a hint"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2l2.8 6.3 6.9.6-5.2 4.6 1.6 6.8L12 16.9l-6.1 3.6 1.6-6.8-5.2-4.6 6.9-.6z" fill="#f2c063" stroke="#f2c063" stroke-width="1.2" stroke-linejoin="round"></path></svg><span id="lightText">0</span></button>
  </header>
  <div class="zoom" id="zoomBar">
    <canvas id="zc" aria-hidden="true"></canvas>
    <button type="button" id="z0" aria-label="Show the whole galaxy"></button>
    <button type="button" id="z1" aria-label="Show the area around this field"></button>
    <button type="button" id="z2" aria-label="Show this field"></button>
  </div>
  <div class="stage" id="stage">
    <div class="loading" id="loading">Building the galaxy…</div>
    <canvas id="lo" aria-hidden="true"></canvas>
    <canvas id="cv" aria-label="Galaxy map. Swipe over letters to select a word. Drag elsewhere to move around. Pinch or scroll to zoom."></canvas>
    <canvas id="ov" aria-hidden="true"></canvas>
    <button type="button" class="quick hidden" id="quickBtn" aria-label="Accept the selected word" title="Accept the selected word"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path id="quickPath" d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <div class="menu hidden" id="menu">
      <div class="label" id="menuLabel">Galaxy</div>
      <button type="button" id="shareBtn">Copy progress link</button>
      <button type="button" id="newGalaxyBtn">New galaxy…</button>
      <button type="button" id="cheatBtn" class="hidden" style="color: var(--gold)">🪄 Solve this field (test)</button>
      <button type="button" id="langBtn">🌐 Deutsch</button>
      <a href="/games/" id="allGames">All games</a>
      <button type="button" class="quiet" id="menuCloseBtn">Close</button>
    </div>
    <div class="dialog-back hidden" id="ngBack">
      <div class="dialog ng" role="dialog" aria-labelledby="ngTitle">
        <h2 id="ngTitle">New galaxy</h2>
        <div class="sub" id="ngLevel">Difficulty</div>
        <div class="ng" id="ngLevels"></div>
        <div class="row">
          <label class="seed"><span id="ngNumber">Galaxy number</span> <input type="text" inputmode="numeric" id="seedInput" autocomplete="off"></label>
          <button type="button" class="btn auto" id="randomBtn">Random</button>
        </div>
        <div class="row">
          <button type="button" class="btn" id="ngCancel">Cancel</button>
          <button type="button" class="btn main" id="buildBtn">Start</button>
        </div>
      </div>
    </div>
    <div class="dialog-back hidden" id="dialog">
      <div class="dialog" role="alertdialog" aria-labelledby="dlgTitle" aria-describedby="dlgText">
        <h2 id="dlgTitle"></h2>
        <p id="dlgText"></p>
        <div class="row">
          <button type="button" class="btn" id="dlgNo"></button>
          <button type="button" class="btn danger" id="dlgYes"></button>
        </div>
      </div>
    </div>
  </div>
  <div class="bar">
    <div class="msg" id="msg" role="status"></div>
  </div>
</div>
<script>
// This page can come from the browser cache (up to 10 minutes on GitHub Pages).
// Ask the server for the newest build without the cache; if this page is older, load the newest once.
var BUILD = 'be1b950031';
(function () {
  try {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
      if (!v || !v.build || v.build === BUILD) return;
      var u = new URL(location.href);
      if (u.searchParams.get('b') === v.build) return; // tried once already
      u.searchParams.set('b', v.build);
      location.replace(u.pathname + u.search + location.hash);
    }).catch(function () {});
  } catch (e) {}
})();
</script>
<script>
// A tiny stand-in for the prototype runtime: state changes call update(), which copies values into the page.
var C = null, pending = false;
function scheduleUpdate() { if (pending) return; pending = true; requestAnimationFrame(function () { pending = false; update(); }); }
class DCLogic {
  constructor(props) { this.props = props || {}; }
  setState(o) { Object.assign(this.state, o); scheduleUpdate(); }
  forceUpdate() { scheduleUpdate(); }
}
</script>
<script src="words.js?v=89568335aa"></script>
<script src="game.js?v=72dfeff9ff"></script>
<script>
var WORDS_DE_SRC = 'words-de.js?v=2456a30795';
// German words are a separate file, loaded only when needed
window.loadWords = function (lang, cb) {
  if (lang !== 'de' || window.WORDS_DE) { cb(true); return; }
  var sc = document.createElement('script');
  sc.src = WORDS_DE_SRC;
  sc.onload = function () { cb(!!window.WORDS_DE); };
  sc.onerror = function () { cb(false); };
  document.head.appendChild(sc);
};
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  var seed = parseInt(params.get('seed'), 10);
  if (isNaN(seed)) seed = null; // no seed in the address: continue the saved game
  var level = params.get('level');
  var lang = params.get('lang');
  if (lang !== 'de' && lang !== 'en') { try { lang = localStorage.getItem('wordgalaxy:lang'); } catch (e) { lang = null; } }
  if (lang !== 'de') lang = 'en';
  // a progress link from another device: #p=<code>
  var progress = /^#p=([A-Za-z0-9_-]+)$/.exec(location.hash);
  progress = progress && progress[1];
  if (progress) seed = null;
  var cv = $('cv'), stage = $('stage');

  function start() {
    C = new Component({ start: 'field', seed: seed, level: level, lang: lang });
    fit();
    $('loading').classList.add('hidden');
    update();
    if (progress) {
      history.replaceState(null, '', location.pathname + location.search);
      C.importCode(progress).then(function (sv) { C.offerImport(sv); }, function (err) {
        C.say(C.T('linkBad', err.message), 'warn'); C.bump();
      });
    }
  }
  if (lang === 'de') {
    $('loading').textContent = 'Die Wörter werden geladen …';
    window.loadWords('de', function (ok) { if (!ok) lang = 'en'; setTimeout(start, 20); });
  } else setTimeout(start, 20);

  function fit() {
    if (!C) return;
    var r = stage.getBoundingClientRect();
    C.VW = Math.round(r.width); C.VH = Math.round(r.height);
    C._cv = null; C._lo = null;
    C.setupCanvas(cv);
    C.setupLo(document.getElementById('lo'));
    C._ov = null;
    C.setupOv(document.getElementById('ov'));
    C._zc = null;
    C.setupZoom(document.getElementById('zc'));
    if (!fit.done) { C.cam = C.camFor('field', C.focus); fit.done = true; }
    C.clampCam();
    C.paint();
  }
  window.addEventListener('resize', function () { fit(); });

  // a swipe from the edge of the screen can mean "back" in the browser:
  // the canvas stops the browser gestures (pointer events still come), and the first "back" after a touch stays in the game
  cv.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
  var backGuard = false;
  function guardBack() { if (backGuard) return; try { history.pushState({ wordGalaxy: 1 }, '', location.href); backGuard = true; } catch (err) {} }
  window.addEventListener('popstate', function () { if (!backGuard) return; backGuard = false; if (C) { C.say(C.T('backAgain'), 'warn'); C.bump(); } });
  cv.addEventListener('pointerdown', function (e) { guardBack(); C && C.down(e); });
  cv.addEventListener('pointermove', function (e) { C && C.move(e); });
  cv.addEventListener('pointerup', function (e) { C && C.up(e); });
  cv.addEventListener('pointercancel', function (e) { C && C.up(e); });
  cv.addEventListener('wheel', function (e) { if (!C) return; e.preventDefault(); C.wheel(e); }, { passive: false });
  cv.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  var v = {};
  $('lightBtn').onclick = function () { v.useLight && v.useLight(); };
  $('quickBtn').onclick = function () { v.accept && v.accept(); };
  $('randomBtn').onclick = function () { v.randomSeed && v.randomSeed(); };
  $('buildBtn').onclick = function () { v.buildSeed && v.buildSeed(); };
  $('ngCancel').onclick = function () { v.closeSeed && v.closeSeed(); };
  $('cheatBtn').onclick = function () { v.cheatSolve && v.cheatSolve(); };
  $('langBtn').onclick = function () { v.switchLang && v.switchLang(); };
  $('menuBtn').onclick = function () { v.toggleMenu && v.toggleMenu(); };
  $('menuCloseBtn').onclick = function () { v.toggleMenu && v.toggleMenu(); };
  $('shareBtn').onclick = function () { v.shareProgress && v.shareProgress(); };
  $('newGalaxyBtn').onclick = function () { v.openNewGalaxy && v.openNewGalaxy(); };
  $('dlgYes').onclick = function () { v.confirmYes && v.confirmYes(); };
  $('dlgNo').onclick = function () { v.confirmNo && v.confirmNo(); };
  $('seedInput').addEventListener('input', function (e) { v.onSeedInput && v.onSeedInput(e); });
  $('seedInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); v.buildSeed && v.buildSeed(); } });
  [0, 1, 2].forEach(function (i) { $('z' + i).onclick = function () { var z = v.zoomBtns && v.zoomBtns[i]; if (z) z.pick(); }; });

  var shownSeed = null;
  window.update = function () {
    if (!C) return;
    v = C.renderVals();
    $('level').textContent = v.focusLevel;
    $('level').title = v.focusPips;
    $('name').textContent = v.focusName;
    $('name').classList.toggle('long', (v.focusName || '').length > 10);
    $('progress').textContent = v.focusProgress;
    $('msg').innerHTML = '';
    if (v.msgTitle) { var b = document.createElement('b'); b.textContent = v.msgTitle + ' '; $('msg').appendChild(b); }
    $('msg').appendChild(document.createTextNode(v.msg || ''));
    $('msg').style.color = v.msgColor;
    document.documentElement.lang = v.lang;
    // texts in the chosen language
    $('menuBtn').setAttribute('aria-label', v.tMenu);
    $('lightBtn').title = v.tStarsTitle;
    $('cv').setAttribute('aria-label', v.tMap);
    $('shareBtn').textContent = v.tCopyLink;
    $('newGalaxyBtn').textContent = v.tNewGalaxy;
    $('cheatBtn').textContent = v.tCheat; $('cheatBtn').classList.toggle('hidden', !v.cheat);
    $('langBtn').textContent = '🌐 ' + v.tOtherLang; $('langBtn').setAttribute('aria-label', v.tOtherLangAria);
    $('allGames').textContent = v.tAllGames;
    $('menuCloseBtn').textContent = v.tClose;
    (v.zoomBtns || []).forEach(function (z, i) { $('z' + i).setAttribute('aria-label', z.label); });
    // new galaxy: difficulty and number
    $('ngBack').classList.toggle('hidden', !v.newOpen);
    if (v.newOpen) {
      $('ngTitle').textContent = v.tNgTitle; $('ngLevel').textContent = v.tNgLevel; $('ngNumber').textContent = v.tNgNumber;
      $('randomBtn').textContent = v.tNgRandom; $('ngCancel').textContent = v.tNgCancel; $('buildBtn').textContent = v.tNgStart;
      var box = $('ngLevels');
      if (box.children.length !== v.levelBtns.length) {
        box.innerHTML = '';
        v.levelBtns.forEach(function (b, i) {
          var el = document.createElement('button'); el.type = 'button'; el.className = 'lvl';
          el.innerHTML = '<span class="t"><span class="p"></span> <span class="n"></span></span><span class="d"></span>';
          el.onclick = function () { var x = v.levelBtns[i]; if (x) x.pick(); };
          box.appendChild(el);
        });
      }
      v.levelBtns.forEach(function (b, i) {
        var el = box.children[i];
        el.setAttribute('aria-pressed', b.pressed);
        el.querySelector('.p').textContent = b.pips; el.querySelector('.n').textContent = b.name; el.querySelector('.d').textContent = b.desc;
      });
    }
    $('lightText').textContent = v.lightLeft;
    var qb = $('quickBtn');
    qb.classList.toggle('hidden', !v.quickShow);
    if (v.quickShow) {
      qb.style.transform = 'translate(' + v.quickX + 'px,' + v.quickY + 'px)';
      qb.setAttribute('aria-label', v.tAccept); qb.title = v.tAccept;
    }
    $('lightBtn').setAttribute('aria-label', v.tStarsAria);
    var inp = $('seedInput');
    if (document.activeElement !== inp) inp.value = v.seedText;
    (v.zoomBtns || []).forEach(function (z, i) { var b = $('z' + i); b.style.left = z.x + 'px'; b.style.top = z.y + 'px'; b.style.width = z.w + 'px'; b.style.height = z.h + 'px'; });
    $('menu').classList.toggle('hidden', !v.menuOpen);
    $('menuBtn').setAttribute('aria-expanded', v.menuExpanded);
    $('menuLabel').textContent = v.tMenuGalaxy + ' · ' + BUILD.slice(0, 7);
    $('dialog').classList.toggle('hidden', !v.confirmOpen);
    $('dlgTitle').textContent = v.confirmTitle;
    $('dlgText').textContent = v.confirmText;
    $('dlgYes').textContent = v.confirmYesLabel;
    $('dlgNo').textContent = v.confirmNoLabel;
    // keep the galaxy in the address, so it can be shared
    var key = C.seed + ':' + C.level + ':' + C.lang;
    if (key !== shownSeed) {
      shownSeed = key;
      var u = new URL(location.href); u.searchParams.set('seed', C.seed); u.searchParams.delete('b');
      if (C.level !== 'hard') u.searchParams.set('level', C.level); else u.searchParams.delete('level');
      if (C.lang === 'de') u.searchParams.set('lang', 'de'); else u.searchParams.delete('lang');
      history.replaceState(null, '', u.pathname + u.search);
    }
  };
})();
</script>
</body>
</html>
