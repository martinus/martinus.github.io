<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 360" font-family="Inter, system-ui, sans-serif" font-size="12.5">
  <style>
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
    .muted{fill:#6b7280}
    .h{font-weight:600;fill:#1f2937;font-size:13px}
    .box{fill:#fff;stroke:#1f2937;stroke-width:1.2}
    .q{fill:#f9fafb;stroke:#9ca3af;stroke-width:1.2}
    .cheap{fill:#ccfbf1;stroke:#0f766e;stroke-width:1.2}
    .cost{fill:#ffedd5;stroke:#c2410c;stroke-width:1.2}
    .flow{stroke:#6b7280;stroke-width:1.4;fill:none;marker-end:url(#headg)}
    .lbl{fill:#6b7280;font-size:11px}
  </style>
  <defs>
    <marker id="headg" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- scan lane -->
  <text x="20" y="22" class="h">scan: every file the walk finds</text>

  <rect x="20" y="96" width="220" height="46" rx="6" class="q"/>
  <text x="32" y="115">size and mtime unchanged</text>
  <text x="32" y="132">since the last run?</text>
  <rect x="270" y="96" width="114" height="46" rx="6" class="cheap"/>
  <text x="282" y="115">keep stored</text>
  <text x="282" y="132">hashes, no read</text>
  <path d="M240,119 H264" class="flow"/><text x="244" y="112" class="lbl">yes</text>

  <rect x="20" y="176" width="220" height="46" rx="6" class="q"/>
  <text x="32" y="195">same physical extents as a file</text>
  <text x="32" y="212">hashed in this run? (snapshots)</text>
  <rect x="270" y="176" width="114" height="46" rx="6" class="cheap"/>
  <text x="282" y="195">copy its</text>
  <text x="282" y="212">hashes, no read</text>
  <path d="M240,199 H264" class="flow"/><text x="244" y="192" class="lbl">yes</text>

  <rect x="20" y="256" width="220" height="46" rx="6" class="cost"/>
  <text x="32" y="275">read the file, hash every</text>
  <text x="32" y="292">128 KiB block with XXH3</text>

  <rect x="20" y="36" width="220" height="32" rx="6" class="box"/>
  <text x="32" y="57">file</text>
  <path d="M130,68 V90" class="flow"/>
  <path d="M130,142 V170" class="flow"/><text x="136" y="160" class="lbl">no</text>
  <path d="M130,222 V250" class="flow"/><text x="136" y="240" class="lbl">no</text>

  <!-- dedupe lane -->
  <text x="420" y="22" class="h">dedupe: every group of matching hashes</text>

  <rect x="420" y="36" width="210" height="32" rx="6" class="box"/>
  <text x="432" y="57">group of duplicate extents</text>

  <rect x="420" y="96" width="210" height="46" rx="6" class="q"/>
  <text x="432" y="115">already on the same storage?</text>
  <text x="432" y="132" class="muted">checked with <tspan class="mono">FIEMAP</tspan></text>
  <rect x="652" y="96" width="106" height="46" rx="6" class="cheap"/>
  <text x="664" y="115">skip, no</text>
  <text x="664" y="132">read, no ioctl</text>
  <path d="M630,119 H646" class="flow"/><text x="632" y="112" class="lbl">yes</text>

  <rect x="420" y="176" width="210" height="46" rx="6" class="cost"/>
  <text x="432" y="195">prefetch both ranges into the</text>
  <text x="432" y="212">page cache, one sequential read</text>

  <rect x="420" y="256" width="210" height="46" rx="6" class="box"/>
  <text x="432" y="275" class="mono" font-weight="600">FIDEDUPERANGE</text>
  <text x="432" y="292">kernel compares from RAM</text>

  <path d="M525,68 V90" class="flow"/>
  <path d="M525,142 V170" class="flow"/><text x="531" y="160" class="lbl">no</text>
  <path d="M525,222 V250" class="flow"/>

  <!-- legend -->
  <rect x="20" y="330" width="14" height="14" rx="3" class="cheap"/>
  <text x="40" y="341" class="muted">no file data read</text>
  <rect x="170" y="330" width="14" height="14" rx="3" class="cost"/>
  <text x="190" y="341" class="muted">reads file data</text>
  <text x="320" y="341" class="muted">On a re-run of a mostly stable tree, nearly every file takes a green exit.</text>
</svg>
