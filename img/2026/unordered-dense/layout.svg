<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, system-ui, sans-serif" font-size="13">
  <style>
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
    .muted{fill:#6b7280}
    .cell{fill:#fff;stroke:#1f2937;stroke-width:1.2}
    .fp{fill:#ccfbf1}
    .dist{fill:#e0f2fe}
    .idx{fill:#fef3c7}
    .sent{fill:url(#hatch);stroke:#9ca3af;stroke-width:1.2}
    .arrow{stroke:#0f766e;stroke-width:1.6;fill:none;marker-end:url(#head)}
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d1d5db" stroke-width="2"/>
    </pattern>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- one bucket, zoomed -->
  <text x="20" y="24" font-weight="600" fill="#1f2937">one bucket: 8 bytes</text>
  <rect x="20" y="34" width="230" height="30" class="cell dist"/>
  <rect x="250" y="34" width="60" height="30" class="cell fp"/>
  <rect x="310" y="34" width="230" height="30" class="cell idx"/>
  <text x="135" y="54" text-anchor="middle" class="mono">distance from home · 24 bits</text>
  <text x="280" y="54" text-anchor="middle" class="mono">fp · 8</text>
  <text x="425" y="54" text-anchor="middle" class="mono">index into values · 32 bits</text>
  <text x="20" y="84" class="muted" font-size="12">m_dist_and_fingerprint, one uint32_t: distance in the high bits, so it compares as a whole</text>
  <text x="20" y="100" class="muted" font-size="12">0 means empty · distance 1 means "at home" · fp is 8 bits of the hash, a cheap pre-check before comparing keys</text>

  <!-- bucket array -->
  <text x="20" y="140" font-weight="600" fill="#1f2937">m_buckets</text>
  <text x="105" y="140" class="muted" font-size="12">power of two, 80% full at most, indexed by the top hash bits</text>
  <g transform="translate(20,150)">
    <g class="mono" text-anchor="middle">
      <rect x="0"   y="0" width="60" height="30" class="cell"/><text x="30"  y="20">1·9C→3</text>
      <rect x="60"  y="0" width="60" height="30" class="cell"/><text x="90"  y="20">2·5B→0</text>
      <rect x="120" y="0" width="60" height="30" class="cell"/><text x="150" y="20">1·11→5</text>
      <rect x="180" y="0" width="60" height="30" class="cell"/><text x="210" y="20" class="muted">0</text>
      <rect x="240" y="0" width="60" height="30" class="cell"/><text x="270" y="20">1·E0→1</text>
      <rect x="300" y="0" width="60" height="30" class="cell"/><text x="330" y="20">2·A7→4</text>
      <rect x="360" y="0" width="60" height="30" class="cell"/><text x="390" y="20">3·02→2</text>
      <rect x="420" y="0" width="60" height="30" class="cell"/><text x="450" y="20" class="muted">0</text>
      <rect x="480" y="0" width="60" height="30" class="sent"/>
      <rect x="540" y="0" width="60" height="30" class="sent"/>
      <rect x="600" y="0" width="60" height="30" class="sent"/>
    </g>
    <text x="0" y="48" class="muted" font-size="12">bucket 40</text>
    <text x="450" y="48" class="muted" font-size="12" text-anchor="middle">… 47</text>
    <text x="570" y="48" class="muted" font-size="12" text-anchor="middle">3 sentinels, new this year</text>
  </g>

  <!-- values vector -->
  <text x="20" y="262" font-weight="600" fill="#1f2937">m_values</text>
  <text x="95" y="262" class="muted" font-size="12">a std::vector&lt;std::pair&lt;Key, T&gt;&gt;, in insertion order, what iteration walks</text>
  <g transform="translate(20,272)" class="mono" text-anchor="middle">
    <rect x="0"   y="0" width="100" height="30" class="cell"/><text x="50"  y="20">0: {k, v}</text>
    <rect x="100" y="0" width="100" height="30" class="cell"/><text x="150" y="20">1: {k, v}</text>
    <rect x="200" y="0" width="100" height="30" class="cell"/><text x="250" y="20">2: {k, v}</text>
    <rect x="300" y="0" width="100" height="30" class="cell"/><text x="350" y="20">3: {k, v}</text>
    <rect x="400" y="0" width="100" height="30" class="cell"/><text x="450" y="20">4: {k, v}</text>
    <rect x="500" y="0" width="100" height="30" class="cell"/><text x="550" y="20">5: {k, v}</text>
  </g>
  <!-- arrows bucket -> value -->
  <path d="M110,180 C110,230 70,230 70,272" class="arrow"/>
  <path d="M350,180 C350,230 470,230 470,272" class="arrow"/>
  <path d="M410,180 C410,230 270,230 270,272" class="arrow"/>
  <text x="20" y="322" class="muted" font-size="12">1·9C→3 reads: distance 1, fingerprint 0x9C, value index 3. The key itself is never in a bucket.</text>
</svg>
