<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 322" font-family="Inter, system-ui, sans-serif" font-size="13">
  <style>
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
    .muted{fill:#6b7280}
    .lbl{fill:#1f2937;font-size:12px}
    .hd{fill:#1f2937;font-weight:600}
    .cell{fill:#fff;stroke:#1f2937;stroke-width:1.2}
    .fp{fill:#ccfbf1}
    .dist{fill:#e0f2fe}
    .idx{fill:#fef3c7}
    .ovf{fill:#ede9fe}
    .payload{fill:#f1f5f9}
    .sent{fill:url(#hatch);stroke:#9ca3af;stroke-width:1.2}
    .arrow{stroke:#0f766e;stroke-width:1.6;fill:none;marker-end:url(#head)}
    .thin{stroke:#9ca3af;stroke-width:1;fill:none}
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d1d5db" stroke-width="2"/>
    </pattern>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="20" y="24" class="hd" text-anchor="start">one group: 40 bytes for 8 slots</text>
  <rect x="132" y="34" width="26" height="30" class="cell fp"/>
  <text x="145" y="53" class="mono" text-anchor="middle" font-size="11">c0</text>
  <rect x="158" y="34" width="26" height="30" class="cell fp"/>
  <text x="171" y="53" class="mono" text-anchor="middle" font-size="11">5A</text>
  <rect x="184" y="34" width="26" height="30" class="cell fp"/>
  <text x="197" y="53" class="mono" text-anchor="middle" font-size="11">80</text>
  <rect x="210" y="34" width="26" height="30" class="cell fp"/>
  <text x="223" y="53" class="mono" text-anchor="middle" font-size="11">11</text>
  <rect x="236" y="34" width="26" height="30" class="cell fp"/>
  <text x="249" y="53" class="mono" text-anchor="middle" font-size="11">c0</text>
  <rect x="262" y="34" width="26" height="30" class="cell fp"/>
  <text x="275" y="53" class="mono" text-anchor="middle" font-size="11">7F</text>
  <rect x="288" y="34" width="26" height="30" class="cell fp"/>
  <text x="301" y="53" class="mono" text-anchor="middle" font-size="11">3C</text>
  <rect x="314" y="34" width="26" height="30" class="cell fp"/>
  <text x="327" y="53" class="mono" text-anchor="middle" font-size="11">c0</text>
  <text x="120" y="54" class="muted" text-anchor="end">tags</text>
  <path d="M132,64 L132,70 L340,70 L340,64" class="thin"/>
  <text x="236" y="82" class="muted" text-anchor="middle">0xc0 empty, 0x80 deleted, otherwise the top 7 bits</text>
  <text x="354" y="47" class="muted" text-anchor="start">both markers have the top two bits set, so one</text>
  <text x="354" y="63" class="muted" text-anchor="start">and-shift-movemask finds every empty slot</text>
  <rect x="132" y="122" width="26" height="30" class="cell idx"/>
  <text x="145" y="141" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="158" y="122" width="26" height="30" class="cell idx"/>
  <text x="171" y="141" class="mono" text-anchor="middle" font-size="11">3</text>
  <rect x="184" y="122" width="26" height="30" class="cell idx"/>
  <text x="197" y="141" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="210" y="122" width="26" height="30" class="cell idx"/>
  <text x="223" y="141" class="mono" text-anchor="middle" font-size="11">7</text>
  <rect x="236" y="122" width="26" height="30" class="cell idx"/>
  <text x="249" y="141" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="262" y="122" width="26" height="30" class="cell idx"/>
  <text x="275" y="141" class="mono" text-anchor="middle" font-size="11">1</text>
  <rect x="288" y="122" width="26" height="30" class="cell idx"/>
  <text x="301" y="141" class="mono" text-anchor="middle" font-size="11">5</text>
  <rect x="314" y="122" width="26" height="30" class="cell idx"/>
  <text x="327" y="141" class="mono" text-anchor="middle" font-size="11">0</text>
  <text x="120" y="142" class="muted" text-anchor="end">indices</text>
  <path d="M132,152 L132,158 L340,158 L340,152" class="thin"/>
  <text x="236" y="170" class="muted" text-anchor="middle">32 bytes: a uint32_t per slot</text>
  <rect x="132" y="204" width="26" height="30" class="cell payload"/>
  <text x="145" y="223" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="158" y="204" width="26" height="30" class="cell payload"/>
  <text x="171" y="223" class="mono" text-anchor="middle" font-size="11">1</text>
  <rect x="184" y="204" width="26" height="30" class="cell sent"/>
  <text x="197" y="223" class="mono" text-anchor="middle" font-size="11">2</text>
  <rect x="210" y="204" width="26" height="30" class="cell payload"/>
  <text x="223" y="223" class="mono" text-anchor="middle" font-size="11">3</text>
  <rect x="236" y="204" width="26" height="30" class="cell sent"/>
  <text x="249" y="223" class="mono" text-anchor="middle" font-size="11">4</text>
  <rect x="262" y="204" width="26" height="30" class="cell payload"/>
  <text x="275" y="223" class="mono" text-anchor="middle" font-size="11">5</text>
  <rect x="288" y="204" width="26" height="30" class="cell payload"/>
  <text x="301" y="223" class="mono" text-anchor="middle" font-size="11">6</text>
  <rect x="314" y="204" width="26" height="30" class="cell payload"/>
  <text x="327" y="223" class="mono" text-anchor="middle" font-size="11">7</text>
  <text x="120" y="224" class="muted" text-anchor="end">els</text>
  <path d="M132,234 L132,240 L340,240 L340,234" class="thin"/>
  <text x="236" y="252" class="muted" text-anchor="middle">appended in order, never compacted: the hatched two are erased</text>
  <text x="20" y="276" class="muted" text-anchor="start">Fast for a reason that is on the label: the maximum load is one half, so a lookup almost</text>
  <text x="20" y="292" class="muted" text-anchor="start">always lands in its home group and the tag compare is the whole probe. Buying probe length</text>
  <text x="20" y="308" class="muted" text-anchor="start">with memory is available to any of these designs; it is not an idea about the index.</text>
</svg>
