<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" font-family="Inter, system-ui, sans-serif" font-size="13">
  <style>
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
    .muted{fill:#6b7280}
    .lbl{fill:#1f2937;font-size:12px}
    .hd{fill:#1f2937;font-weight:600}
    .cell{fill:#fff;stroke:#1f2937;stroke-width:1.2}
    .fp{fill:#ccfbf1}
    .dist{fill:#e0f2fe}
    .idx{fill:#fef3c7}
    .ovf{fill:#ede9fe}
    .payload{fill:#f1f5f9}
    .sent{fill:url(#hatch);stroke:#9ca3af;stroke-width:1.2}
    .arrow{stroke:#0f766e;stroke-width:1.6;fill:none;marker-end:url(#head)}
    .thin{stroke:#9ca3af;stroke-width:1;fill:none}
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d1d5db" stroke-width="2"/>
    </pattern>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="20" y="24" class="hd" text-anchor="start">the metadata word: 16 bytes for 15 slots</text>
  <rect x="132" y="34" width="26" height="30" class="cell fp"/>
  <text x="145" y="53" class="mono" text-anchor="middle" font-size="11">h00</text>
  <rect x="158" y="34" width="26" height="30" class="cell fp"/>
  <text x="171" y="53" class="mono" text-anchor="middle" font-size="11">h01</text>
  <rect x="184" y="34" width="26" height="30" class="cell fp"/>
  <text x="197" y="53" class="mono" text-anchor="middle" font-size="11">h02</text>
  <rect x="210" y="34" width="26" height="30" class="cell "/>
  <text x="223" y="53" class="mono" text-anchor="middle" font-size="11">--</text>
  <rect x="236" y="34" width="26" height="30" class="cell fp"/>
  <text x="249" y="53" class="mono" text-anchor="middle" font-size="11">h04</text>
  <rect x="262" y="34" width="26" height="30" class="cell fp"/>
  <text x="275" y="53" class="mono" text-anchor="middle" font-size="11">h05</text>
  <rect x="288" y="34" width="26" height="30" class="cell "/>
  <text x="301" y="53" class="mono" text-anchor="middle" font-size="11">--</text>
  <rect x="314" y="34" width="26" height="30" class="cell fp"/>
  <text x="327" y="53" class="mono" text-anchor="middle" font-size="11">h07</text>
  <rect x="340" y="34" width="26" height="30" class="cell fp"/>
  <text x="353" y="53" class="mono" text-anchor="middle" font-size="11">h08</text>
  <rect x="366" y="34" width="26" height="30" class="cell fp"/>
  <text x="379" y="53" class="mono" text-anchor="middle" font-size="11">h09</text>
  <rect x="392" y="34" width="26" height="30" class="cell fp"/>
  <text x="405" y="53" class="mono" text-anchor="middle" font-size="11">h10</text>
  <rect x="418" y="34" width="26" height="30" class="cell "/>
  <text x="431" y="53" class="mono" text-anchor="middle" font-size="11">--</text>
  <rect x="444" y="34" width="26" height="30" class="cell fp"/>
  <text x="457" y="53" class="mono" text-anchor="middle" font-size="11">h12</text>
  <rect x="470" y="34" width="26" height="30" class="cell fp"/>
  <text x="483" y="53" class="mono" text-anchor="middle" font-size="11">h13</text>
  <rect x="496" y="34" width="26" height="30" class="cell fp"/>
  <text x="509" y="53" class="mono" text-anchor="middle" font-size="11">h14</text>
  <rect x="522" y="34" width="26" height="30" class="cell ovf"/>
  <text x="535" y="53" class="mono" text-anchor="middle" font-size="11">ofw</text>
  <text x="120" y="54" class="muted" text-anchor="end">group15</text>
  <path d="M132,64 L132,70 L522,70 L522,64" class="thin"/>
  <text x="327" y="82" class="muted" text-anchor="middle">0 available, otherwise 2..255 of the hash</text>
  <text x="562" y="54" class="muted" text-anchor="start">the overflow byte</text>
  <text x="20" y="112" class="hd" text-anchor="start">the overflow byte: one bit per hash class</text>
  <rect x="132" y="122" width="26" height="30" class="cell "/>
  <text x="145" y="141" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="158" y="122" width="26" height="30" class="cell "/>
  <text x="171" y="141" class="mono" text-anchor="middle" font-size="11">1</text>
  <rect x="184" y="122" width="26" height="30" class="cell "/>
  <text x="197" y="141" class="mono" text-anchor="middle" font-size="11">2</text>
  <rect x="210" y="122" width="26" height="30" class="cell ovf"/>
  <text x="223" y="141" class="mono" text-anchor="middle" font-size="11">3</text>
  <rect x="236" y="122" width="26" height="30" class="cell "/>
  <text x="249" y="141" class="mono" text-anchor="middle" font-size="11">4</text>
  <rect x="262" y="122" width="26" height="30" class="cell "/>
  <text x="275" y="141" class="mono" text-anchor="middle" font-size="11">5</text>
  <rect x="288" y="122" width="26" height="30" class="cell "/>
  <text x="301" y="141" class="mono" text-anchor="middle" font-size="11">6</text>
  <rect x="314" y="122" width="26" height="30" class="cell "/>
  <text x="327" y="141" class="mono" text-anchor="middle" font-size="11">7</text>
  <text x="120" y="142" class="muted" text-anchor="end">bit h%8</text>
  <text x="354" y="135" class="muted" text-anchor="start">an insert that found this group full set bit 3,</text>
  <text x="354" y="151" class="muted" text-anchor="start">because its hash is 3 mod 8, and probed on</text>
  <rect x="132" y="200" width="26" height="30" class="cell payload"/>
  <rect x="158" y="200" width="26" height="30" class="cell payload"/>
  <rect x="184" y="200" width="26" height="30" class="cell payload"/>
  <rect x="210" y="200" width="26" height="30" class="cell payload"/>
  <rect x="236" y="200" width="26" height="30" class="cell payload"/>
  <rect x="262" y="200" width="26" height="30" class="cell payload"/>
  <rect x="288" y="200" width="26" height="30" class="cell payload"/>
  <rect x="314" y="200" width="26" height="30" class="cell payload"/>
  <rect x="340" y="200" width="26" height="30" class="cell payload"/>
  <rect x="366" y="200" width="26" height="30" class="cell payload"/>
  <rect x="392" y="200" width="26" height="30" class="cell payload"/>
  <rect x="418" y="200" width="26" height="30" class="cell payload"/>
  <rect x="444" y="200" width="26" height="30" class="cell payload"/>
  <rect x="470" y="200" width="26" height="30" class="cell payload"/>
  <rect x="496" y="200" width="26" height="30" class="cell payload"/>
  <text x="120" y="220" class="muted" text-anchor="end">slots[]</text>
  <path d="M132,230 L132,236 L522,236 L522,230" class="thin"/>
  <text x="327" y="248" class="muted" text-anchor="middle">the key and the value, in the slot</text>
  <text x="20" y="272" class="muted" text-anchor="start">A miss stops here unless the bit for its own class is set, so a group that has overflowed</text>
  <text x="20" y="288" class="muted" text-anchor="start">for one class still stops seven eighths of misses. There are no tombstones -- but an erase</text>
  <text x="20" y="304" class="muted" text-anchor="start">cannot clear a bit either, since it cannot know whether some other key still needs it, so</text>
  <text x="20" y="320" class="muted" text-anchor="start">a table that churns without growing gets slower until the next rehash.</text>
</svg>
