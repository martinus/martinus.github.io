<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Inter, system-ui, sans-serif" font-size="13">
  <style>
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
    .muted{fill:#6b7280}
    .lbl{fill:#1f2937;font-size:12px}
    .hd{fill:#1f2937;font-weight:600}
    .cell{fill:#fff;stroke:#1f2937;stroke-width:1.2}
    .fp{fill:#ccfbf1}
    .dist{fill:#e0f2fe}
    .idx{fill:#fef3c7}
    .ovf{fill:#ede9fe}
    .payload{fill:#f1f5f9}
    .sent{fill:url(#hatch);stroke:#9ca3af;stroke-width:1.2}
    .arrow{stroke:#0f766e;stroke-width:1.6;fill:none;marker-end:url(#head)}
    .thin{stroke:#9ca3af;stroke-width:1;fill:none}
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d1d5db" stroke-width="2"/>
    </pattern>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="20" y="24" class="hd" text-anchor="start">one state byte per slot</text>
  <rect x="132" y="34" width="26" height="30" class="cell "/>
  <text x="145" y="53" class="mono" text-anchor="middle" font-size="11">80</text>
  <rect x="158" y="34" width="26" height="30" class="cell fp"/>
  <text x="171" y="53" class="mono" text-anchor="middle" font-size="11">A2</text>
  <rect x="184" y="34" width="26" height="30" class="cell "/>
  <text x="197" y="53" class="mono" text-anchor="middle" font-size="11">80</text>
  <rect x="210" y="34" width="26" height="30" class="cell ovf"/>
  <text x="223" y="53" class="mono" text-anchor="middle" font-size="11">del</text>
  <rect x="236" y="34" width="26" height="30" class="cell fp"/>
  <text x="249" y="53" class="mono" text-anchor="middle" font-size="11">11</text>
  <rect x="262" y="34" width="26" height="30" class="cell fp"/>
  <text x="275" y="53" class="mono" text-anchor="middle" font-size="11">A2</text>
  <rect x="288" y="34" width="26" height="30" class="cell "/>
  <text x="301" y="53" class="mono" text-anchor="middle" font-size="11">80</text>
  <rect x="314" y="34" width="26" height="30" class="cell fp"/>
  <text x="327" y="53" class="mono" text-anchor="middle" font-size="11">7C</text>
  <rect x="340" y="34" width="26" height="30" class="cell "/>
  <text x="353" y="53" class="mono" text-anchor="middle" font-size="11">80</text>
  <rect x="366" y="34" width="26" height="30" class="cell fp"/>
  <text x="379" y="53" class="mono" text-anchor="middle" font-size="11">3F</text>
  <rect x="392" y="34" width="26" height="30" class="cell ovf"/>
  <text x="405" y="53" class="mono" text-anchor="middle" font-size="11">del</text>
  <rect x="418" y="34" width="26" height="30" class="cell "/>
  <text x="431" y="53" class="mono" text-anchor="middle" font-size="11">80</text>
  <rect x="444" y="34" width="26" height="30" class="cell fp"/>
  <text x="457" y="53" class="mono" text-anchor="middle" font-size="11">62</text>
  <rect x="470" y="34" width="26" height="30" class="cell "/>
  <text x="483" y="53" class="mono" text-anchor="middle" font-size="11">80</text>
  <rect x="496" y="34" width="26" height="30" class="cell fp"/>
  <text x="509" y="53" class="mono" text-anchor="middle" font-size="11">A2</text>
  <rect x="522" y="34" width="26" height="30" class="cell fp"/>
  <text x="535" y="53" class="mono" text-anchor="middle" font-size="11">18</text>
  <text x="120" y="54" class="muted" text-anchor="end">states[]</text>
  <path d="M132,64 L132,70 L548,70 L548,64" class="thin"/>
  <text x="340" y="82" class="muted" text-anchor="middle">empty is -128, deleted its own value, otherwise the hash mod 253</text>
  <rect x="132" y="116" width="26" height="30" class="cell payload"/>
  <rect x="158" y="116" width="26" height="30" class="cell payload"/>
  <rect x="184" y="116" width="26" height="30" class="cell payload"/>
  <rect x="210" y="116" width="26" height="30" class="cell payload"/>
  <rect x="236" y="116" width="26" height="30" class="cell payload"/>
  <rect x="262" y="116" width="26" height="30" class="cell payload"/>
  <rect x="288" y="116" width="26" height="30" class="cell payload"/>
  <rect x="314" y="116" width="26" height="30" class="cell payload"/>
  <rect x="340" y="116" width="26" height="30" class="cell payload"/>
  <rect x="366" y="116" width="26" height="30" class="cell payload"/>
  <rect x="392" y="116" width="26" height="30" class="cell payload"/>
  <rect x="418" y="116" width="26" height="30" class="cell payload"/>
  <rect x="444" y="116" width="26" height="30" class="cell payload"/>
  <rect x="470" y="116" width="26" height="30" class="cell payload"/>
  <rect x="496" y="116" width="26" height="30" class="cell payload"/>
  <rect x="522" y="116" width="26" height="30" class="cell payload"/>
  <text x="120" y="136" class="muted" text-anchor="end">slots[]</text>
  <path d="M132,146 L132,152 L548,152 L548,146" class="thin"/>
  <text x="340" y="164" class="muted" text-anchor="middle">the key and the value, in the slot</text>
  <text x="20" y="188" class="muted" text-anchor="start">The home slot is rounded down to a multiple of sixteen, so a compare is always an aligned</text>
  <text x="20" y="204" class="muted" text-anchor="start">group and a probe never straddles two of them. Tombstones, so a table that churns without</text>
  <text x="20" y="220" class="muted" text-anchor="start">growing gets slower until it is rehashed -- the same trade SwissTable makes, with fewer</text>
  <text x="20" y="236" class="muted" text-anchor="start">tricks around it.</text>
</svg>
