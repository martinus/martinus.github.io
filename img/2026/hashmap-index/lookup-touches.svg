<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 602" font-family="Inter, system-ui, sans-serif" font-size="13">
  <style>
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
    .muted{fill:#6b7280}
    .lbl{fill:#1f2937;font-size:12px}
    .hd{fill:#1f2937;font-weight:600}
    .cell{fill:#fff;stroke:#1f2937;stroke-width:1.2}
    .fp{fill:#ccfbf1}
    .dist{fill:#e0f2fe}
    .idx{fill:#fef3c7}
    .ovf{fill:#ede9fe}
    .payload{fill:#f1f5f9}
    .sent{fill:url(#hatch);stroke:#9ca3af;stroke-width:1.2}
    .arrow{stroke:#0f766e;stroke-width:1.6;fill:none;marker-end:url(#head)}
    .thin{stroke:#9ca3af;stroke-width:1;fill:none}
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d1d5db" stroke-width="2"/>
    </pattern>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="20" y="22" class="hd" text-anchor="start">one hit: what it has to wait for, in order</text>
  <text x="20" y="40" class="muted" text-anchor="start">the hash is arithmetic; every box after it is a load whose address the box before it produced, so none of them can start early</text>
  <rect x="236" y="58" width="50" height="18" class="cell dist"/>
  <text x="261" y="71" class="mono" text-anchor="middle">hash</text>
  <rect x="298" y="58" width="124" height="18" class="cell fp"/>
  <text x="360" y="71" class="mono" text-anchor="middle">a new line</text>
  <rect x="434" y="58" width="124" height="18" class="cell idx"/>
  <text x="496" y="71" class="mono" text-anchor="middle">already here</text>
  <text x="20" y="106" class="hd" text-anchor="start">keys in the slots</text>
  <text x="224" y="136" class="lbl" text-anchor="end">abseil, boost, emilib, indivi, F14Value</text>
  <rect x="236" y="116" width="50" height="30" class="cell dist"/>
  <text x="261" y="136" class="mono" text-anchor="middle">hash</text>
  <path d="M286,131.0 L297,131.0" class="arrow"/>
  <rect x="298" y="116" width="124" height="30" class="cell fp"/>
  <text x="360.0" y="136" class="mono" text-anchor="middle" style="font-size:10px">metadata</text>
  <path d="M422,131.0 L433,131.0" class="arrow"/>
  <rect x="434" y="116" width="124" height="30" class="cell idx"/>
  <text x="496.0" y="136" class="mono" text-anchor="middle" style="font-size:10px">key, in the slot</text>
  <text x="224" y="176" class="lbl" text-anchor="end">Verstable</text>
  <rect x="236" y="156" width="50" height="30" class="cell dist"/>
  <text x="261" y="176" class="mono" text-anchor="middle">hash</text>
  <path d="M286,171.0 L297,171.0" class="arrow"/>
  <rect x="298" y="156" width="124" height="30" class="cell fp"/>
  <text x="360.0" y="176" class="mono" text-anchor="middle" style="font-size:10px">16 bit word</text>
  <path d="M422,171.0 L433,171.0" class="arrow"/>
  <rect x="434" y="156" width="124" height="30" class="cell idx"/>
  <text x="496.0" y="176" class="mono" text-anchor="middle" style="font-size:10px">key, in the bucket</text>
  <text x="568" y="176" class="muted" text-anchor="start">+1 per chain step</text>
  <text x="20" y="222" class="hd" text-anchor="start">keys in a vector</text>
  <text x="224" y="252" class="lbl" text-anchor="end">unordered_dense 5.0</text>
  <rect x="236" y="232" width="50" height="30" class="cell dist"/>
  <text x="261" y="252" class="mono" text-anchor="middle">hash</text>
  <path d="M286,247.0 L297,247.0" class="arrow"/>
  <rect x="298" y="232" width="124" height="30" class="cell fp"/>
  <text x="360.0" y="252" class="mono" text-anchor="middle" style="font-size:10px">16 fingerprints</text>
  <path d="M422,247.0 L433,247.0" class="arrow"/>
  <rect x="434" y="232" width="124" height="30" class="cell idx"/>
  <text x="496.0" y="252" class="mono" text-anchor="middle" style="font-size:10px">index</text>
  <path d="M558,247.0 L569,247.0" class="arrow"/>
  <rect x="570" y="232" width="124" height="30" class="cell fp"/>
  <text x="632.0" y="252" class="mono" text-anchor="middle" style="font-size:10px">value</text>
  <text x="224" y="292" class="lbl" text-anchor="end">ihtab</text>
  <rect x="236" y="272" width="50" height="30" class="cell dist"/>
  <text x="261" y="292" class="mono" text-anchor="middle">hash</text>
  <path d="M286,287.0 L297,287.0" class="arrow"/>
  <rect x="298" y="272" width="124" height="30" class="cell fp"/>
  <text x="360.0" y="292" class="mono" text-anchor="middle" style="font-size:10px">8 tags</text>
  <path d="M422,287.0 L433,287.0" class="arrow"/>
  <rect x="434" y="272" width="124" height="30" class="cell idx"/>
  <text x="496.0" y="292" class="mono" text-anchor="middle" style="font-size:10px">index</text>
  <path d="M558,287.0 L569,287.0" class="arrow"/>
  <rect x="570" y="272" width="124" height="30" class="cell fp"/>
  <text x="632.0" y="292" class="mono" text-anchor="middle" style="font-size:10px">element</text>
  <text x="224" y="332" class="lbl" text-anchor="end">F14Vector</text>
  <rect x="236" y="312" width="50" height="30" class="cell dist"/>
  <text x="261" y="332" class="mono" text-anchor="middle">hash</text>
  <path d="M286,327.0 L297,327.0" class="arrow"/>
  <rect x="298" y="312" width="124" height="30" class="cell fp"/>
  <text x="360.0" y="332" class="mono" text-anchor="middle" style="font-size:10px">14 tags</text>
  <path d="M422,327.0 L433,327.0" class="arrow"/>
  <rect x="434" y="312" width="124" height="30" class="cell fp"/>
  <text x="496.0" y="332" class="mono" text-anchor="middle" style="font-size:10px">index</text>
  <path d="M558,327.0 L569,327.0" class="arrow"/>
  <rect x="570" y="312" width="124" height="30" class="cell fp"/>
  <text x="632.0" y="332" class="mono" text-anchor="middle" style="font-size:10px">value</text>
  <text x="224" y="372" class="lbl" text-anchor="end">unordered_dense 4.11.0</text>
  <rect x="236" y="352" width="50" height="30" class="cell dist"/>
  <text x="261" y="372" class="mono" text-anchor="middle">hash</text>
  <path d="M286,367.0 L297,367.0" class="arrow"/>
  <rect x="298" y="352" width="124" height="30" class="cell fp"/>
  <text x="360.0" y="372" class="mono" text-anchor="middle" style="font-size:10px">bucket word</text>
  <path d="M422,367.0 L433,367.0" class="arrow"/>
  <rect x="434" y="352" width="124" height="30" class="cell fp"/>
  <text x="496.0" y="372" class="mono" text-anchor="middle" style="font-size:10px">value</text>
  <text x="224" y="412" class="lbl" text-anchor="end">emhash8</text>
  <rect x="236" y="392" width="50" height="30" class="cell dist"/>
  <text x="261" y="412" class="mono" text-anchor="middle">hash</text>
  <path d="M286,407.0 L297,407.0" class="arrow"/>
  <rect x="298" y="392" width="124" height="30" class="cell fp"/>
  <text x="360.0" y="412" class="mono" text-anchor="middle" style="font-size:10px">index word</text>
  <path d="M422,407.0 L433,407.0" class="arrow"/>
  <rect x="434" y="392" width="124" height="30" class="cell fp"/>
  <text x="496.0" y="412" class="mono" text-anchor="middle" style="font-size:10px">value</text>
  <text x="568" y="412" class="muted" text-anchor="start">+1 per chain step</text>
  <text x="20" y="458" class="hd" text-anchor="start">keys behind a pointer</text>
  <text x="224" y="488" class="lbl" text-anchor="end">boost, abseil, F14 node</text>
  <rect x="236" y="468" width="50" height="30" class="cell dist"/>
  <text x="261" y="488" class="mono" text-anchor="middle">hash</text>
  <path d="M286,483.0 L297,483.0" class="arrow"/>
  <rect x="298" y="468" width="124" height="30" class="cell fp"/>
  <text x="360.0" y="488" class="mono" text-anchor="middle" style="font-size:10px">metadata</text>
  <path d="M422,483.0 L433,483.0" class="arrow"/>
  <rect x="434" y="468" width="124" height="30" class="cell idx"/>
  <text x="496.0" y="488" class="mono" text-anchor="middle" style="font-size:8px">pointer, in the slot</text>
  <path d="M558,483.0 L569,483.0" class="arrow"/>
  <rect x="570" y="468" width="124" height="30" class="cell fp"/>
  <text x="632.0" y="488" class="mono" text-anchor="middle" style="font-size:10px">node</text>
  <text x="224" y="528" class="lbl" text-anchor="end">std::unordered_map</text>
  <rect x="236" y="508" width="50" height="30" class="cell dist"/>
  <text x="261" y="528" class="mono" text-anchor="middle">hash</text>
  <path d="M286,523.0 L297,523.0" class="arrow"/>
  <rect x="298" y="508" width="124" height="30" class="cell fp"/>
  <text x="360.0" y="528" class="mono" text-anchor="middle" style="font-size:10px">bucket pointer</text>
  <path d="M422,523.0 L433,523.0" class="arrow"/>
  <rect x="434" y="508" width="124" height="30" class="cell fp"/>
  <text x="496.0" y="528" class="mono" text-anchor="middle" style="font-size:10px">node</text>
  <text x="568" y="528" class="muted" text-anchor="start">+1 per chain step</text>
  <text x="20" y="566" class="muted" text-anchor="start">A flat map waits for two loads and a dense one for three -- unless its metadata word already carries the index, which is what</text>
  <text x="20" y="581" class="muted" text-anchor="start">unordered_dense 4.11.0 and emhash8 do, and what they pay for elsewhere.</text>
</svg>
