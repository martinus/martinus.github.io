<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 374" font-family="Inter, system-ui, sans-serif" font-size="13">
  <style>
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
    .muted{fill:#6b7280}
    .lbl{fill:#1f2937;font-size:12px}
    .hd{fill:#1f2937;font-weight:600}
    .cell{fill:#fff;stroke:#1f2937;stroke-width:1.2}
    .fp{fill:#ccfbf1}
    .dist{fill:#e0f2fe}
    .idx{fill:#fef3c7}
    .ovf{fill:#ede9fe}
    .payload{fill:#f1f5f9}
    .sent{fill:url(#hatch);stroke:#9ca3af;stroke-width:1.2}
    .arrow{stroke:#0f766e;stroke-width:1.6;fill:none;marker-end:url(#head)}
    .thin{stroke:#9ca3af;stroke-width:1;fill:none}
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d1d5db" stroke-width="2"/>
    </pattern>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="20" y="24" class="hd" text-anchor="start">emhash8: 8 index bytes per bucket, and no key</text>
  <rect x="132.0" y="40" width="300.0" height="16" class="cell dist"/>
  <text x="282.0" y="52" class="mono" text-anchor="middle" font-size="9">next</text>
  <rect x="432.0" y="40" width="300.0" height="16" class="cell idx"/>
  <text x="582.0" y="52" class="mono" text-anchor="middle" font-size="9">slot</text>
  <line x1="132.0" y1="56" x2="132.0" y2="64" stroke="#9ca3af" stroke-width="1"/>
  <line x1="207.0" y1="56" x2="207.0" y2="61" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="282.0" y1="56" x2="282.0" y2="61" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="357.0" y1="56" x2="357.0" y2="61" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="432.0" y1="56" x2="432.0" y2="61" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="507.0" y1="56" x2="507.0" y2="61" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="582.0" y1="56" x2="582.0" y2="61" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="657.0" y1="56" x2="657.0" y2="61" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="732.0" y1="56" x2="732.0" y2="64" stroke="#9ca3af" stroke-width="1"/>
  <text x="132.0" y="77" class="muted" text-anchor="start" font-size="10">0</text>
  <text x="432.0" y="77" class="muted" text-anchor="middle" font-size="10">4</text>
  <text x="732.0" y="77" class="muted" text-anchor="end" font-size="10">8</text>
  <text x="20" y="106" class="hd" text-anchor="start">the slot word, when the table has fewer than 2^32 slots</text>
  <rect x="132" y="118" width="130" height="30" class="cell fp"/>
  <text x="197" y="137" class="mono" text-anchor="middle" font-size="11">hash bits</text>
  <rect x="262" y="118" width="78" height="30" class="cell idx"/>
  <text x="301" y="137" class="mono" text-anchor="middle" font-size="11">slot</text>
  <text x="120" y="138" class="muted" text-anchor="end">slot</text>
  <path d="M132,148 L132,154 L262,154 L262,148" class="thin"/>
  <text x="197" y="166" class="muted" text-anchor="middle">everything above log2(bucket count)</text>
  <text x="354" y="131" class="muted" text-anchor="start">a fingerprint that costs nothing, because</text>
  <text x="354" y="147" class="muted" text-anchor="start">the word has to be loaded anyway</text>
  <text x="20" y="196" class="hd" text-anchor="start">the chain, threaded through the index</text>
  <rect x="132" y="208" width="52" height="30" class="cell dist"/>
  <text x="158" y="227" class="mono" text-anchor="middle" font-size="11">next 2</text>
  <rect x="184" y="208" width="52" height="30" class="cell "/>
  <text x="210" y="227" class="mono" text-anchor="middle" font-size="11">--</text>
  <rect x="236" y="208" width="52" height="30" class="cell dist"/>
  <text x="262" y="227" class="mono" text-anchor="middle" font-size="11">next 4</text>
  <rect x="288" y="208" width="52" height="30" class="cell "/>
  <text x="314" y="227" class="mono" text-anchor="middle" font-size="11">--</text>
  <rect x="340" y="208" width="52" height="30" class="cell dist"/>
  <text x="366" y="227" class="mono" text-anchor="middle" font-size="11">end</text>
  <rect x="392" y="208" width="52" height="30" class="cell "/>
  <text x="418" y="227" class="mono" text-anchor="middle" font-size="11">--</text>
  <text x="120" y="228" class="muted" text-anchor="end">index[]</text>
  <path d="M158,238 C158,264 262,264 262,240" class="arrow"/>
  <path d="M262,238 C262,278 366,278 366,240" class="arrow"/>
  <rect x="132" y="304" width="52" height="30" class="cell payload"/>
  <text x="158" y="323" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="184" y="304" width="52" height="30" class="cell payload"/>
  <text x="210" y="323" class="mono" text-anchor="middle" font-size="11">1</text>
  <rect x="236" y="304" width="52" height="30" class="cell payload"/>
  <text x="262" y="323" class="mono" text-anchor="middle" font-size="11">2</text>
  <rect x="288" y="304" width="52" height="30" class="cell payload"/>
  <text x="314" y="323" class="mono" text-anchor="middle" font-size="11">3</text>
  <rect x="340" y="304" width="52" height="30" class="cell payload"/>
  <text x="366" y="323" class="mono" text-anchor="middle" font-size="11">4</text>
  <rect x="392" y="304" width="52" height="30" class="cell payload"/>
  <text x="418" y="323" class="mono" text-anchor="middle" font-size="11">5</text>
  <text x="120" y="324" class="muted" text-anchor="end">values</text>
  <path d="M132,334 L132,340 L444,340 L444,334" class="thin"/>
  <text x="288" y="352" class="muted" text-anchor="middle">a dense vector, in insertion order</text>
</svg>
