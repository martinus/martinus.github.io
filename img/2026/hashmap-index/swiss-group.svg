  <text x="314" y="53" class="mono" text-anchor="middle" font-size="11">H1</text>
  <text x="120" y="54" class="muted" text-anchor="end">64 bit hash</text>
  <text x="354" y="47" class="muted" text-anchor="start">H2: the top 7 bits, stored as the control byte</text>
  <text x="354" y="63" class="muted" text-anchor="start">H1: the whole hash, masked, picks the group</text>
  <text x="20" y="94" class="hd" text-anchor="start">the control bytes: one per slot, sixteen read at once</text>
