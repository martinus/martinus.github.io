  <text x="535" y="53" class="mono" text-anchor="middle" font-size="11">out</text>
  <text x="120" y="54" class="muted" text-anchor="end">F14Chunk</text>
  <path d="M132,64 L132,70 L496,70 L496,64" class="thin"/>
  <text x="314" y="82" class="muted" text-anchor="middle">tags_: 0 is empty, otherwise the top byte of the hash</text>
  <rect x="132" y="122" width="104" height="30" class="cell dist"/>
  <text x="184" y="141" class="mono" text-anchor="middle" font-size="11">scale</text>
  <rect x="236" y="122" width="104" height="30" class="cell ovf"/>
  <text x="288" y="141" class="mono" text-anchor="middle" font-size="11">hosted</text>
  <text x="120" y="142" class="muted" text-anchor="end">control_</text>
  <text x="354" y="135" class="muted" text-anchor="start">four bits of capacity scale, in chunk 0 only, and four</text>
  <text x="354" y="151" class="muted" text-anchor="start">bits counting the keys hosted here that belong elsewhere</text>
  <rect x="132" y="176" width="208" height="30" class="cell ovf"/>
  <text x="236" y="195" class="mono" text-anchor="middle" font-size="11">saturating count</text>
  <text x="120" y="196" class="muted" text-anchor="end">outbound</text>
  <text x="354" y="189" class="muted" text-anchor="start">how many keys wanted this chunk and did not fit,</text>
  <text x="354" y="205" class="muted" text-anchor="start">including those that had already passed a full one</text>
