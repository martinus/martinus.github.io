<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 422" font-family="Inter, system-ui, sans-serif" font-size="13">
  <style>
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
    .muted{fill:#6b7280}
    .lbl{fill:#1f2937;font-size:12px}
    .hd{fill:#1f2937;font-weight:600}
    .cell{fill:#fff;stroke:#1f2937;stroke-width:1.2}
    .fp{fill:#ccfbf1}
    .dist{fill:#e0f2fe}
    .idx{fill:#fef3c7}
    .ovf{fill:#ede9fe}
    .payload{fill:#f1f5f9}
    .sent{fill:url(#hatch);stroke:#9ca3af;stroke-width:1.2}
    .arrow{stroke:#0f766e;stroke-width:1.6;fill:none;marker-end:url(#head)}
    .thin{stroke:#9ca3af;stroke-width:1;fill:none}
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d1d5db" stroke-width="2"/>
    </pattern>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="20" y="24" class="hd" text-anchor="start">one lookup in an open addressing hash map</text>
  <rect x="20" y="46" width="78" height="30" class="cell payload"/>
  <text x="59" y="65" class="mono" text-anchor="middle" font-size="11">key</text>
  <path d="M102,61.0 L124,61.0" class="arrow"/>
  <rect x="128" y="46" width="78" height="30" class="cell dist"/>
  <text x="167" y="65" class="mono" text-anchor="middle" font-size="11">hash</text>
  <path d="M210,61.0 L232,61.0" class="arrow"/>
  <rect x="236" y="46" width="104" height="30" class="cell dist"/>
  <text x="288" y="65" class="mono" text-anchor="middle" font-size="11">home bits</text>
  <rect x="340" y="46" width="130" height="30" class="cell "/>
  <rect x="470" y="46" width="52" height="30" class="cell fp"/>
  <text x="496" y="65" class="mono" text-anchor="middle" font-size="11">fp</text>
  <text x="236" y="38" class="muted" text-anchor="start">the 64 bit hash</text>
  <text x="530" y="66" class="muted" text-anchor="start">kept beside the slot</text>
  <text x="20" y="128" class="hd" text-anchor="start">the metadata</text>
  <text x="112" y="128" class="muted" text-anchor="start">a byte or two per slot</text>
  <rect x="132" y="150" width="26" height="30" class="cell "/>
  <text x="145" y="169" class="mono" text-anchor="middle" font-size="11">--</text>
  <rect x="158" y="150" width="26" height="30" class="cell fp"/>
  <text x="171" y="169" class="mono" text-anchor="middle" font-size="11">A2</text>
  <rect x="184" y="150" width="26" height="30" class="cell "/>
  <text x="197" y="169" class="mono" text-anchor="middle" font-size="11">--</text>
  <rect x="210" y="150" width="26" height="30" class="cell fp"/>
  <text x="223" y="169" class="mono" text-anchor="middle" font-size="11">7C</text>
  <rect x="236" y="150" width="26" height="30" class="cell fp"/>
  <text x="249" y="169" class="mono" text-anchor="middle" font-size="11">11</text>
  <rect x="262" y="150" width="26" height="30" class="cell "/>
  <text x="275" y="169" class="mono" text-anchor="middle" font-size="11">--</text>
  <rect x="288" y="150" width="26" height="30" class="cell fp"/>
  <text x="301" y="169" class="mono" text-anchor="middle" font-size="11">A2</text>
  <rect x="314" y="150" width="26" height="30" class="cell fp"/>
  <text x="327" y="169" class="mono" text-anchor="middle" font-size="11">3F</text>
  <rect x="340" y="150" width="26" height="30" class="cell "/>
  <text x="353" y="169" class="mono" text-anchor="middle" font-size="11">--</text>
  <rect x="366" y="150" width="26" height="30" class="cell fp"/>
  <text x="379" y="169" class="mono" text-anchor="middle" font-size="11">62</text>
  <rect x="392" y="150" width="26" height="30" class="cell fp"/>
  <text x="405" y="169" class="mono" text-anchor="middle" font-size="11">A2</text>
  <rect x="418" y="150" width="26" height="30" class="cell "/>
  <text x="431" y="169" class="mono" text-anchor="middle" font-size="11">--</text>
  <rect x="444" y="150" width="26" height="30" class="cell fp"/>
  <text x="457" y="169" class="mono" text-anchor="middle" font-size="11">18</text>
  <rect x="470" y="150" width="26" height="30" class="cell "/>
  <text x="483" y="169" class="mono" text-anchor="middle" font-size="11">--</text>
  <rect x="496" y="150" width="26" height="30" class="cell fp"/>
  <text x="509" y="169" class="mono" text-anchor="middle" font-size="11">5E</text>
  <rect x="522" y="150" width="26" height="30" class="cell "/>
  <text x="535" y="169" class="mono" text-anchor="middle" font-size="11">--</text>
  <text x="120" y="170" class="muted" text-anchor="end">metadata</text>
  <rect x="288" y="147" width="26" height="36" fill="none" stroke="#0f766e" stroke-width="2"/>
  <path d="M288,78 C288,110 301.0,110 301.0,142" class="arrow"/>
  <circle cx="310" cy="106" r="9" fill="#0f766e"/>
  <text x="310" y="110" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">1</text>
  <text x="324" y="110" class="muted" text-anchor="start">home: which slot the key belongs in</text>
  <circle cx="145.0" cy="204" r="9" fill="#0f766e"/>
  <text x="145.0" y="208" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">2</text>
  <text x="159" y="208" class="muted" text-anchor="start">here? one compare says whether any of these sixteen could be mine</text>
  <circle cx="570" cy="165.0" r="9" fill="#0f766e"/>
  <text x="570" y="169.0" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">4</text>
  <path d="M582,165.0 L604,165.0" class="arrow"/>
  <text x="608" y="164" class="muted" text-anchor="start">where next:</text>
  <text x="608" y="178" class="muted" text-anchor="start">on to the next</text>
  <circle cx="145.0" cy="226" r="9" fill="#0f766e"/>
  <text x="145.0" y="230" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">3</text>
  <text x="159" y="230" class="muted" text-anchor="start">absent: an empty slot proves the key is not in the table</text>
  <rect x="132" y="264" width="26" height="30" class="cell "/>
  <rect x="158" y="264" width="26" height="30" class="cell payload"/>
  <rect x="184" y="264" width="26" height="30" class="cell "/>
  <rect x="210" y="264" width="26" height="30" class="cell payload"/>
  <rect x="236" y="264" width="26" height="30" class="cell payload"/>
  <rect x="262" y="264" width="26" height="30" class="cell "/>
  <rect x="288" y="264" width="26" height="30" class="cell payload"/>
  <rect x="314" y="264" width="26" height="30" class="cell payload"/>
  <rect x="340" y="264" width="26" height="30" class="cell "/>
  <rect x="366" y="264" width="26" height="30" class="cell payload"/>
  <rect x="392" y="264" width="26" height="30" class="cell payload"/>
  <rect x="418" y="264" width="26" height="30" class="cell "/>
  <rect x="444" y="264" width="26" height="30" class="cell payload"/>
  <rect x="470" y="264" width="26" height="30" class="cell "/>
  <rect x="496" y="264" width="26" height="30" class="cell payload"/>
  <rect x="522" y="264" width="26" height="30" class="cell "/>
  <text x="120" y="284" class="muted" text-anchor="end">slots</text>
  <path d="M132,294 L132,300 L548,300 L548,294" class="thin"/>
  <text x="340" y="312" class="muted" text-anchor="middle">the key and the value, or an index that finds them</text>
  <circle cx="145.0" cy="340" r="9" fill="#0f766e"/>
  <text x="145.0" y="344" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">5</text>
  <text x="159" y="344" class="muted" text-anchor="start">gone: what does erasing one of them leave behind?</text>
</svg>
