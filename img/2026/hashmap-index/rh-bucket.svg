<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="Inter, system-ui, sans-serif" font-size="13">
  <style>
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
    .muted{fill:#6b7280}
    .lbl{fill:#1f2937;font-size:12px}
    .hd{fill:#1f2937;font-weight:600}
    .cell{fill:#fff;stroke:#1f2937;stroke-width:1.2}
    .fp{fill:#ccfbf1}
    .dist{fill:#e0f2fe}
    .idx{fill:#fef3c7}
    .ovf{fill:#ede9fe}
    .payload{fill:#f1f5f9}
    .sent{fill:url(#hatch);stroke:#9ca3af;stroke-width:1.2}
    .arrow{stroke:#0f766e;stroke-width:1.6;fill:none;marker-end:url(#head)}
    .thin{stroke:#9ca3af;stroke-width:1;fill:none}
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d1d5db" stroke-width="2"/>
    </pattern>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="20" y="24" class="hd" text-anchor="start">a run of buckets, and what an insert does to it</text>
  <rect x="132" y="44" width="52" height="30" class="cell "/>
  <text x="158" y="63" class="mono" text-anchor="middle" font-size="11">1.9C&gt;3</text>
  <rect x="184" y="44" width="52" height="30" class="cell "/>
  <text x="210" y="63" class="mono" text-anchor="middle" font-size="11">2.5B&gt;0</text>
  <rect x="236" y="44" width="52" height="30" class="cell "/>
  <text x="262" y="63" class="mono" text-anchor="middle" font-size="11">3.11&gt;5</text>
  <rect x="288" y="44" width="52" height="30" class="cell "/>
  <text x="314" y="63" class="mono" text-anchor="middle" font-size="11">1.E0&gt;1</text>
  <rect x="340" y="44" width="52" height="30" class="cell "/>
  <text x="366" y="63" class="mono" text-anchor="middle" font-size="11">2.A7&gt;4</text>
  <rect x="392" y="44" width="52" height="30" class="cell "/>
  <text x="418" y="63" class="mono" text-anchor="middle" font-size="11">0</text>
  <text x="120" y="64" class="muted" text-anchor="end">before</text>
  <rect x="132" y="100" width="52" height="30" class="cell "/>
  <text x="158" y="119" class="mono" text-anchor="middle" font-size="11">1.9C&gt;3</text>
  <rect x="184" y="100" width="52" height="30" class="cell "/>
  <text x="210" y="119" class="mono" text-anchor="middle" font-size="11">2.5B&gt;0</text>
  <rect x="236" y="100" width="52" height="30" class="cell fp"/>
  <text x="262" y="119" class="mono" text-anchor="middle" font-size="11">2.33&gt;6</text>
  <rect x="288" y="100" width="52" height="30" class="cell "/>
  <text x="314" y="119" class="mono" text-anchor="middle" font-size="11">4.11&gt;5</text>
  <rect x="340" y="100" width="52" height="30" class="cell "/>
  <text x="366" y="119" class="mono" text-anchor="middle" font-size="11">2.E0&gt;1</text>
  <rect x="392" y="100" width="52" height="30" class="cell "/>
  <text x="418" y="119" class="mono" text-anchor="middle" font-size="11">3.A7&gt;4</text>
  <text x="120" y="120" class="muted" text-anchor="end">after</text>
  <path d="M262,78 L262,96" class="arrow"/>
  <text x="458" y="64" class="muted" text-anchor="start">each cell is distance . fingerprint &gt; value index</text>
  <text x="20" y="174" class="hd" text-anchor="start">one bucket, to byte scale</text>
  <rect x="132.0" y="186" width="210.0" height="16" class="cell dist"/>
  <text x="237.0" y="198" class="mono" text-anchor="middle" font-size="9">distance</text>
  <rect x="342.0" y="186" width="70.0" height="16" class="cell fp"/>
  <text x="377.0" y="198" class="mono" text-anchor="middle" font-size="9">fp</text>
  <rect x="412.0" y="186" width="280.0" height="16" class="cell idx"/>
  <text x="552.0" y="198" class="mono" text-anchor="middle" font-size="9">value index</text>
  <line x1="132.0" y1="202" x2="132.0" y2="210" stroke="#9ca3af" stroke-width="1"/>
  <line x1="202.0" y1="202" x2="202.0" y2="207" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="272.0" y1="202" x2="272.0" y2="207" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="342.0" y1="202" x2="342.0" y2="207" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="412.0" y1="202" x2="412.0" y2="207" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="482.0" y1="202" x2="482.0" y2="207" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="552.0" y1="202" x2="552.0" y2="207" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="622.0" y1="202" x2="622.0" y2="207" stroke="#9ca3af" stroke-width="0.6"/>
  <line x1="692.0" y1="202" x2="692.0" y2="210" stroke="#9ca3af" stroke-width="1"/>
  <text x="132.0" y="223" class="muted" text-anchor="start" font-size="10">0</text>
  <text x="342.0" y="223" class="muted" text-anchor="middle" font-size="10">3</text>
  <text x="412.0" y="223" class="muted" text-anchor="middle" font-size="10">4</text>
  <text x="692.0" y="223" class="muted" text-anchor="end" font-size="10">8</text>
  <text x="702" y="199" class="muted" text-anchor="start">8 bytes</text>
</svg>
