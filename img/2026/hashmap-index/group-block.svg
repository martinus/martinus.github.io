  <rect x="288" y="34" width="26" height="30" class="cell fp"/>
  <text x="301" y="53" class="mono" text-anchor="middle" font-size="11">B3</text>
  <rect x="314" y="34" width="26" height="30" class="cell fp"/>
  <text x="327" y="53" class="mono" text-anchor="middle" font-size="11">5A</text>
  <rect x="340" y="34" width="26" height="30" class="cell fp"/>
  <text x="353" y="53" class="mono" text-anchor="middle" font-size="11">--</text>
  <rect x="366" y="34" width="26" height="30" class="cell fp"/>
  <text x="379" y="53" class="mono" text-anchor="middle" font-size="11">22</text>
  <rect x="392" y="34" width="26" height="30" class="cell fp"/>
  <text x="405" y="53" class="mono" text-anchor="middle" font-size="11">9C</text>
  <rect x="418" y="34" width="26" height="30" class="cell fp"/>
  <text x="431" y="53" class="mono" text-anchor="middle" font-size="11">8E</text>
  <rect x="444" y="34" width="26" height="30" class="cell fp"/>
  <text x="457" y="53" class="mono" text-anchor="middle" font-size="11">--</text>
  <rect x="470" y="34" width="26" height="30" class="cell fp"/>
  <text x="483" y="53" class="mono" text-anchor="middle" font-size="11">6D</text>
  <rect x="496" y="34" width="26" height="30" class="cell fp"/>
  <text x="509" y="53" class="mono" text-anchor="middle" font-size="11">F1</text>
  <rect x="522" y="34" width="26" height="30" class="cell fp"/>
  <text x="535" y="53" class="mono" text-anchor="middle" font-size="11">--</text>
  <text x="120" y="54" class="muted" text-anchor="end">fingerprints</text>
  <path d="M132,64 L132,70 L548,70 L548,64" class="thin"/>
  <text x="340" y="82" class="muted" text-anchor="middle">16 bytes: 0 is empty, otherwise the low byte of the hash, never 0</text>
  <rect x="132" y="116" width="52" height="30" class="cell ovf"/>
  <text x="158" y="135" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="184" y="116" width="52" height="30" class="cell ovf"/>
  <text x="210" y="135" class="mono" text-anchor="middle" font-size="11">1</text>
  <rect x="236" y="116" width="52" height="30" class="cell ovf"/>
  <text x="262" y="135" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="288" y="116" width="52" height="30" class="cell ovf"/>
  <text x="314" y="135" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="340" y="116" width="52" height="30" class="cell ovf"/>
  <text x="366" y="135" class="mono" text-anchor="middle" font-size="11">2</text>
  <rect x="392" y="116" width="52" height="30" class="cell ovf"/>
  <text x="418" y="135" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="444" y="116" width="52" height="30" class="cell ovf"/>
  <text x="470" y="135" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="496" y="116" width="52" height="30" class="cell ovf"/>
  <text x="522" y="135" class="mono" text-anchor="middle" font-size="11">0</text>
  <text x="120" y="136" class="muted" text-anchor="end">overflow</text>
  <path d="M132,146 L132,152 L548,152 L548,146" class="thin"/>
  <text x="340" y="164" class="muted" text-anchor="middle">8 bytes: one counter per fingerprint class, up on the way past, down on erase</text>
  <rect x="132" y="198" width="26" height="30" class="cell idx"/>
  <text x="145" y="217" class="mono" text-anchor="middle" font-size="11">7</text>
  <rect x="158" y="198" width="26" height="30" class="cell idx"/>
  <text x="171" y="217" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="184" y="198" width="26" height="30" class="cell idx"/>
  <text x="197" y="217" class="mono" text-anchor="middle" font-size="11">3</text>
  <rect x="210" y="198" width="26" height="30" class="cell idx"/>
  <text x="223" y="217" class="mono" text-anchor="middle" font-size="11">12</text>
  <rect x="236" y="198" width="26" height="30" class="cell idx"/>
  <text x="249" y="217" class="mono" text-anchor="middle" font-size="11">5</text>
  <rect x="262" y="198" width="26" height="30" class="cell idx"/>
  <text x="275" y="217" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="288" y="198" width="26" height="30" class="cell idx"/>
  <text x="301" y="217" class="mono" text-anchor="middle" font-size="11">1</text>
  <rect x="314" y="198" width="26" height="30" class="cell idx"/>
  <text x="327" y="217" class="mono" text-anchor="middle" font-size="11">9</text>
  <rect x="340" y="198" width="26" height="30" class="cell idx"/>
  <text x="353" y="217" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="366" y="198" width="26" height="30" class="cell idx"/>
  <text x="379" y="217" class="mono" text-anchor="middle" font-size="11">4</text>
  <rect x="392" y="198" width="26" height="30" class="cell idx"/>
  <text x="405" y="217" class="mono" text-anchor="middle" font-size="11">2</text>
  <rect x="418" y="198" width="26" height="30" class="cell idx"/>
  <text x="431" y="217" class="mono" text-anchor="middle" font-size="11">8</text>
  <rect x="444" y="198" width="26" height="30" class="cell idx"/>
  <text x="457" y="217" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="470" y="198" width="26" height="30" class="cell idx"/>
  <text x="483" y="217" class="mono" text-anchor="middle" font-size="11">6</text>
  <rect x="496" y="198" width="26" height="30" class="cell idx"/>
  <text x="509" y="217" class="mono" text-anchor="middle" font-size="11">11</text>
  <rect x="522" y="198" width="26" height="30" class="cell idx"/>
  <text x="535" y="217" class="mono" text-anchor="middle" font-size="11">0</text>
  <text x="120" y="218" class="muted" text-anchor="end">value index</text>
  <path d="M132,228 L132,234 L548,234 L548,228" class="thin"/>
  <text x="340" y="246" class="muted" text-anchor="middle">64 bytes: a uint32_t per slot, at a fixed offset from the fingerprints</text>
  <rect x="132" y="306" width="52" height="30" class="cell payload"/>
  <text x="158" y="325" class="mono" text-anchor="middle" font-size="11">0</text>
  <rect x="184" y="306" width="52" height="30" class="cell payload"/>
  <text x="210" y="325" class="mono" text-anchor="middle" font-size="11">1</text>
  <rect x="236" y="306" width="52" height="30" class="cell payload"/>
  <text x="262" y="325" class="mono" text-anchor="middle" font-size="11">2</text>
  <rect x="288" y="306" width="52" height="30" class="cell payload"/>
  <text x="314" y="325" class="mono" text-anchor="middle" font-size="11">3</text>
  <rect x="340" y="306" width="52" height="30" class="cell payload"/>
  <text x="366" y="325" class="mono" text-anchor="middle" font-size="11">4</text>
  <rect x="392" y="306" width="52" height="30" class="cell payload"/>
  <text x="418" y="325" class="mono" text-anchor="middle" font-size="11">5</text>
  <rect x="444" y="306" width="52" height="30" class="cell payload"/>
  <text x="470" y="325" class="mono" text-anchor="middle" font-size="11">6</text>
  <rect x="496" y="306" width="52" height="30" class="cell payload"/>
  <text x="522" y="325" class="mono" text-anchor="middle" font-size="11">7</text>
  <text x="120" y="326" class="muted" text-anchor="end">m_values</text>
  <path d="M132,336 L132,342 L548,342 L548,336" class="thin"/>
  <text x="340" y="354" class="muted" text-anchor="middle">a std::vector&lt;std::pair&lt;Key, T&gt;&gt; in insertion order</text>
  <path d="M145.0,260 C145.0,284 522,284 522,304" class="arrow"/>
  <path d="M197.0,260 C197.0,284 314,284 314,304" class="arrow"/>
  <path d="M379.0,260 C379.0,284 366,284 366,304" class="arrow"/>
  <text x="20" y="390" class="muted" text-anchor="start">5.5 bytes of index per slot. The group comes from the top of the hash and the fingerprint</text>
  <text x="20" y="406" class="muted" text-anchor="start">from the bottom, so the two are independent. A miss stops at the first group whose counter</text>
  <text x="20" y="422" class="muted" text-anchor="start">for its own class is zero -- or at the end of the array, which is the bound that makes a</text>
  <text x="20" y="438" class="muted" text-anchor="start">hostile hash slow rather than endless.</text>
</svg>
