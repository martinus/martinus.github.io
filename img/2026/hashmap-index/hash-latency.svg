  <text x="8" y="22" class="hd">What a string hash costs a lookup, by key length</text>
  <text x="8" y="42" class="sub">nanoseconds per hash, each one waiting on the one before it, which is the order a map pays them in</text>
  <text x="8" y="60" class="sub">median of three runs, every hash interleaved in one process; about 1.5 ns of every line is the chain's own store and load</text>
