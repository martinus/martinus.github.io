<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" font-family="Inter, system-ui, sans-serif" font-size="13">
  <style>
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
    .muted{fill:#6b7280}
    .lbl{fill:#1f2937;font-size:12px}
    .hd{fill:#1f2937;font-weight:600}
    .cell{fill:#fff;stroke:#1f2937;stroke-width:1.2}
    .fp{fill:#ccfbf1}
    .dist{fill:#e0f2fe}
    .idx{fill:#fef3c7}
    .ovf{fill:#ede9fe}
    .payload{fill:#f1f5f9}
    .sent{fill:url(#hatch);stroke:#9ca3af;stroke-width:1.2}
    .arrow{stroke:#0f766e;stroke-width:1.6;fill:none;marker-end:url(#head)}
    .thin{stroke:#9ca3af;stroke-width:1;fill:none}
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d1d5db" stroke-width="2"/>
    </pattern>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="20" y="24" class="hd" text-anchor="start">one bucket's metadata: two bytes, used as sixteen bits</text>
  <rect x="132" y="44" width="52" height="30" class="cell fp"/>
  <text x="158" y="63" class="mono" text-anchor="middle" font-size="9">fragment</text>
  <rect x="184" y="44" width="26" height="30" class="cell ovf"/>
  <text x="197" y="63" class="mono" text-anchor="middle" font-size="9">home</text>
  <rect x="210" y="44" width="130" height="30" class="cell dist"/>
  <text x="275" y="63" class="mono" text-anchor="middle" font-size="11">displacement</text>
  <text x="120" y="64" class="muted" text-anchor="end">uint16_t</text>
  <text x="132" y="92" class="muted" text-anchor="start">4 bits</text>
  <text x="184" y="92" class="muted" text-anchor="start">1</text>
  <text x="210" y="92" class="muted" text-anchor="start">11 bits, the step to the next key in this bucket's chain</text>
  <text x="20" y="130" class="hd" text-anchor="start">the chain: a lookup visits only buckets holding keys that belong to it</text>
  <rect x="132" y="140" width="26" height="30" class="cell "/>
  <rect x="158" y="140" width="26" height="30" class="cell fp"/>
  <text x="171" y="159" class="mono" text-anchor="middle" font-size="9">home</text>
  <rect x="184" y="140" width="26" height="30" class="cell "/>
  <rect x="210" y="140" width="26" height="30" class="cell "/>
  <rect x="236" y="140" width="26" height="30" class="cell fp"/>
  <text x="249" y="159" class="mono" text-anchor="middle" font-size="11">+5</text>
  <rect x="262" y="140" width="26" height="30" class="cell "/>
  <rect x="288" y="140" width="26" height="30" class="cell "/>
  <rect x="314" y="140" width="26" height="30" class="cell "/>
  <rect x="340" y="140" width="26" height="30" class="cell fp"/>
  <text x="353" y="159" class="mono" text-anchor="middle" font-size="11">end</text>
  <rect x="366" y="140" width="26" height="30" class="cell "/>
  <text x="120" y="160" class="muted" text-anchor="end">buckets</text>
  <path d="M171.0,170 C171.0,196 249.0,196 249.0,172" class="arrow"/>
  <path d="M249.0,170 C249.0,212 353.0,212 353.0,172" class="arrow"/>
</svg>
