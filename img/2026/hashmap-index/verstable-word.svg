<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" font-family="Inter, system-ui, sans-serif" font-size="13">
  <style>
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px}
    .muted{fill:#6b7280}
    .lbl{fill:#1f2937;font-size:12px}
    .hd{fill:#1f2937;font-weight:600}
    .cell{fill:#fff;stroke:#1f2937;stroke-width:1.2}
    .fp{fill:#ccfbf1}
    .dist{fill:#e0f2fe}
    .idx{fill:#fef3c7}
    .ovf{fill:#ede9fe}
    .payload{fill:#f1f5f9}
    .sent{fill:url(#hatch);stroke:#9ca3af;stroke-width:1.2}
    .arrow{stroke:#0f766e;stroke-width:1.6;fill:none;marker-end:url(#head)}
    .thin{stroke:#9ca3af;stroke-width:1;fill:none}
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d1d5db" stroke-width="2"/>
    </pattern>
    <marker id="head" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0f766e"/>
    </marker>
  </defs>
  <text x="20" y="24" class="hd" text-anchor="start">one bucket's metadata: 16 bits</text>
  <rect x="132" y="34" width="52" height="30" class="cell fp"/>
  <text x="158" y="53" class="mono" text-anchor="middle" font-size="9">fragment</text>
  <rect x="184" y="34" width="26" height="30" class="cell ovf"/>
  <text x="197" y="53" class="mono" text-anchor="middle" font-size="9">home</text>
  <rect x="210" y="34" width="130" height="30" class="cell dist"/>
  <text x="275" y="53" class="mono" text-anchor="middle" font-size="11">displacement</text>
  <text x="120" y="54" class="muted" text-anchor="end">uint16_t</text>
  <path d="M132,64 L132,70 L184,70 L184,64" class="thin"/>
  <text x="158" y="82" class="muted" text-anchor="middle">4 bits</text>
  <path d="M184,64 L184,70 L210,70 L210,64" class="thin"/>
  <text x="197" y="82" class="muted" text-anchor="middle">1</text>
  <path d="M210,64 L210,70 L340,70 L340,64" class="thin"/>
  <text x="275" y="82" class="muted" text-anchor="middle">11 bits, to the next key in this chain</text>
  <text x="20" y="106" class="muted" text-anchor="start">The home bit says a key that belongs in this bucket is sitting here, which is exactly the</text>
  <text x="20" y="122" class="muted" text-anchor="start">question a miss asks -- and it is exact, where an overflow counter is only a hint.</text>
  <text x="20" y="156" class="hd" text-anchor="start">the chain: a lookup visits only buckets holding keys that belong to it</text>
  <rect x="132" y="166" width="26" height="30" class="cell "/>
  <rect x="158" y="166" width="26" height="30" class="cell fp"/>
  <text x="171" y="185" class="mono" text-anchor="middle" font-size="9">home</text>
  <rect x="184" y="166" width="26" height="30" class="cell "/>
  <rect x="210" y="166" width="26" height="30" class="cell "/>
  <rect x="236" y="166" width="26" height="30" class="cell fp"/>
  <text x="249" y="185" class="mono" text-anchor="middle" font-size="11">+5</text>
  <rect x="262" y="166" width="26" height="30" class="cell "/>
  <rect x="288" y="166" width="26" height="30" class="cell "/>
  <rect x="314" y="166" width="26" height="30" class="cell "/>
  <rect x="340" y="166" width="26" height="30" class="cell fp"/>
  <text x="353" y="185" class="mono" text-anchor="middle" font-size="11">end</text>
  <rect x="366" y="166" width="26" height="30" class="cell "/>
  <text x="120" y="186" class="muted" text-anchor="end">buckets</text>
  <path d="M171.0,196 C171.0,222 249.0,222 249.0,198" class="arrow"/>
  <path d="M249.0,196 C249.0,238 353.0,238 353.0,198" class="arrow"/>
  <text x="20" y="272" class="muted" text-anchor="start">Fewest instructions of any map measured here, and twice the cycles of a group compare on a</text>
  <text x="20" y="288" class="muted" text-anchor="start">miss: how long the chain is, and whether there is one at all, are decisions the branch</text>
  <text x="20" y="304" class="muted" text-anchor="start">predictor cannot make. A group compare asks one question whatever the group holds.</text>
</svg>
